 DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel — Rifa do Gêmeos</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
        body{background:#f4f6f9;padding:20px}
        .login-box{max-width:380px;margin:80px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
        h2{text-align:center;margin-bottom:20px;color:#003366}
        input{width:100%;padding:12px;margin:8px 0;border:2px solid #ddd;border-radius:8px;font-size:16px}
        button{width:100%;padding:13px;background:#0066cc;color:white;border:none;border-radius:8px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:10px}
        .locked{text-align:center;font-size:60px;margin-bottom:10px}
        .dashboard{display:none;max-width:900px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
        .stat-card{background:white;padding:18px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
        .stat-num{font-size:26px;font-weight:bold;color:#0066cc}
        table{width:100%;background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);border-collapse:collapse}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #eee;font-size:14px}
        th{background:#003366;color:white}
        .status-pending{color:#e67700;font-weight:bold}
        .status-paid{color:#009933;font-weight:bold}
        .logout{background:#dc3545}
        .refresh{background:#28a745;margin-right:8px;width:auto;padding:8px 15px}
        .btn-row{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap}
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <div class="locked">🔒</div>
        <h2>Área Restrita</h2>
        <p style="text-align:center;color:#666;margin-bottom:15px">Digite sua senha para acessar</p>
        <input type="password" id="senha" placeholder="Senha administrativa">
        <button onclick="login()">Entrar</button>
        <p style="text-align:center;font-size:12px;color:#999;margin-top:15px">Senha padrão: 123456 — altere no código!</p>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>📊 Painel — Rifa do Gêmeos</h1>
            <button class="logout" onclick="logout()">Sair</button>
        </div>
        
        <div class="btn-row">
            <button class="refresh" onclick="carregarDados()">🔄 Atualizar</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div>Total de Vendas</div>
                <div class="stat-num" id="totalVendas">0</div>
            </div>
            <div class="stat-card">
                <div>Confirmadas</div>
                <div class="stat-num" id="confirmadas">0</div>
            </div>
            <div class="stat-card">
                <div>Pendentes</div>
                <div class="stat-num" id="pendentes">0</div>
            </div>
            <div class="stat-card">
                <div>Valor Total</div>
                <div class="stat-num" id="valorTotal">R$ 0,00</div>
            </div>
        </div>

        <h3 style="margin:25px 0 12px">📋 Lista de Compras</h3>
        <table id="tabela">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Cliente</th>
                    <th>CPF</th>
                    <th>WhatsApp</th>
                    <th>Cotas</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <tr><td colspan="7" style="text-align:center;padding:20px;color:#999">Carregando...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ⚠️ ALTERE A SENHA AQUI!
        const SENHA_CORRETA = '123456';

        function login() {
            const senha = document.getElementById('senha').value;
            if(senha === SENHA_CORRETA) {
                localStorage.setItem('painelLogado', 'sim');
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                carregarDados();
            } else {
                alert('Senha incorreta!');
            }
        }
        function logout() {
            localStorage.removeItem('painelLogado');
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('senha').value = '';
        }
        function verificarLogin() {
            if(localStorage.getItem('painelLogado') === 'sim') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                carregarDados();
            }
        }
        async function carregarDados() {
            try {
                const r = await fetch('/api/vendas');
                const vendas = await r.json();
                atualizarTabela(vendas);
                atualizarEstatisticas(vendas);
            } catch(e) {
                document.getElementById('corpoTabela').innerHTML = 
                    '<tr><td colspan="7" style="text-align:center;padding:20px;color:red">Erro ao carregar dados</td></tr>';
            }
        }
        function atualizarTabela(vendas) {
            const tb = document.getElementById('corpoTabela');
            if(!vendas.length) {
                tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:#999">Nenhuma venda ainda</td></tr>';
                return;
            }
            tb.innerHTML = vendas.map(v => `
                <tr>
                    <td>${new Date(v.createdAt).toLocaleDateString('pt-BR')}</td>
                    <td>${v.nome}</td>
                    <td>${v.cpf}</td>
                    <td>${v.whatsapp}</td>
                    <td>${v.quantidade}</td>
                    <td>R$ ${Number(v.valorTotal).toFixed(2).replace('.', ',')}</td>
                    <td class="${v.status === 'CONFIRMED' || v.status === 'RECEIVED' ? 'status-paid' : 'status-pending'}">
                        ${v.status === 'CONFIRMED' || v.status === 'RECEIVED' ? '✅ Pago' : '⏳ Pendente'}
                    </td>
                </tr>
            `).join('');
        }
        function atualizarEstatisticas(vendas) {
            const confirmadas = vendas.filter(v => v.status === 'CONFIRMED' || v.status === 'RECEIVED');
            document.getElementById('totalVendas').textContent = vendas.length;
            document.getElementById('confirmadas').textContent = confirmadas.length;
            document.getElementById('pendentes').textContent = vendas.length - confirmadas.length;
            const total = confirmadas.reduce((s,v) => s + Number(v.valorTotal), 0);
            document.getElementById('valorTotal').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }
        verificarLogin();
    </script>
</body>
</html>
